name: Build Vevo Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - run: bun install
      - name: Build Frontend and Rust Backend
        run: bun run build
      - name: Prepare Distribution Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/release/vevo-client.exe" "dist/"
          Copy-Item "target/release/*.dll" "dist/" -ErrorAction SilentlyContinue
          Copy-Item "target/release/*.bin" "dist/" -ErrorAction SilentlyContinue
          Copy-Item "target/release/*.pak" "dist/" -ErrorAction SilentlyContinue
          if (Test-Path "target/release/locales") {
              Copy-Item -Recurse "target/release/locales" "dist/"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: VevoClient-Windows
          path: dist/
