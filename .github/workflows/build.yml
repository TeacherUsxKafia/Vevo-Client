name: Build Vevo Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - run: bun install
      - name: Build Frontend and Rust Backend
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: VevoClient-Windows
          path: target/release/vevo-client.exe
